# Configuration DefectDojo - Adaptation du protocole uWSGI pour Render
services:
  # 1. Le Cache (Render Key Value)
  - type: keyvalue
    name: dojo-redis
    plan: free
    region: oregon
    ipAllowList: []

  # 2. L'application Web DefectDojo
  - type: web
    name: defectdojo-web
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/defectdojo/defectdojo-django:latest
    envVars:
      - key: PORT
        value: "8080"
      # --- CONFIGURATION UWSGI POUR RENDER ---
      - key: UWSGI_HTTP
        value: ":8080" # Force uWSGI à parler en HTTP sur le port 8080
      - key: UWSGI_BUFFER_SIZE
        value: "32768" # Augmente le buffer pour éviter le "max 8192"
      # ---------------------------------------
      - key: DD_DATABASE_URL
        fromDatabase:
          name: dojo-db-v2
          property: connectionString
      - key: DD_REDIS_URL
        fromService:
          type: keyvalue
          name: dojo-redis
          property: connectionString
      - key: DD_SECRET_KEY
        generateValue: true
      - key: DD_DEBUG
        value: "false"
      - key: DD_ALLOWED_HOSTS
        value: "*"

# 3. La Base de Données PostgreSQL
databases:
  - name: dojo-db-v2
    postgresMajorVersion: '18'
    plan: free
    region: oregon
    ipAllowList: []