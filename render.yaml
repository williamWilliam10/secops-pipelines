# Configuration DefectDojo - Correction stricte du port via variable d'environnement
services:
  # 1. Le Cache (Render Key Value)
  - type: keyvalue
    name: dojo-redis
    plan: free
    region: oregon
    ipAllowList: []

  # 2. L'application Web DefectDojo
  - type: web
    name: defectdojo-web
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/defectdojo/defectdojo-django:latest # Plus de propriété 'port' ici !
    envVars:
      - key: PORT
        value: "8080" # <--- C'est comme ça que Render comprend quel port écouter pour l'image
      - key: DD_DATABASE_URL
        fromDatabase:
          name: dojo-db-v2
          property: connectionString
      - key: DD_REDIS_URL
        fromService:
          type: keyvalue
          name: dojo-redis
          property: connectionString
      - key: DD_SECRET_KEY
        generateValue: true
      - key: DD_DEBUG
        value: "false"
      - key: DD_ALLOWED_HOSTS
        value: "*"

# 3. La Base de Données PostgreSQL
databases:
  - name: dojo-db-v2
    postgresMajorVersion: '18'
    plan: free
    region: oregon
    ipAllowList: []