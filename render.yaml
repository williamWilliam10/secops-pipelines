# Configuration DefectDojo - Correction du bloc image.port et rafraîchissement BDD
services:
  # 1. Le Cache (Render Key Value)
  - type: keyvalue
    name: dojo-redis
    plan: free
    region: oregon
    ipAllowList: []

  # 2. L'application Web DefectDojo
  - type: web
    name: defectdojo-web
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/defectdojo/defectdojo-django:latest
      port: 8080 # <--- Placé ICI, à l'intérieur du bloc image !
    envVars:
      - key: DD_DATABASE_URL
        fromDatabase:
          name: dojo-db-v2 # Point vers le nouveau nom de la BDD
          property: connectionString
      - key: DD_REDIS_URL
        fromService:
          type: keyvalue
          name: dojo-redis
          property: connectionString
      - key: DD_SECRET_KEY
        generateValue: true
      - key: DD_DEBUG
        value: "false"
      - key: DD_ALLOWED_HOSTS
        value: "*"

# 3. La Base de Données PostgreSQL (Nouveau nom pour forcer la recréation en Oregon)
databases:
  - name: dojo-db-v2
    postgresMajorVersion: '18'
    plan: free
    region: oregon
    ipAllowList: []