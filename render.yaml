# Configuration DefectDojo 100% GRATUITE
services:
  # 1. Le Cache (Render Key Value)
  - type: keyvalue
    name: dojo-redis
    plan: free # <--- Changé de starter à free
    ipAllowList: []

  # 2. L'application Web DefectDojo
  - type: web
    name: defectdojo-web
    runtime: image
    plan: free # <--- Changé de starter à free
    image:
      url: docker.io/defectdojo/defectdojo-django:latest
    envVars:
      - key: DD_DATABASE_URL
        fromDatabase:
          name: dojo-db
          property: connectionString
      - key: DD_REDIS_URL
        fromService:
          type: keyvalue
          name: dojo-redis
          property: connectionString
      - key: DD_SECRET_KEY
        generateValue: true
      - key: DD_DEBUG
        value: "false"
      - key: DD_ALLOWED_HOSTS
        value: "*"

# 3. La Base de Données PostgreSQL
databases:
  - name: dojo-db
    postgresMajorVersion: '18'
    plan: free # <--- Changé de starter à free
    ipAllowList: []